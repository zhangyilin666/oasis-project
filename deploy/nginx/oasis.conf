# 小易 生产环境 Nginx 配置
# 部署路径：/etc/nginx/sites-available/oasis
# 启用方式：ln -s /etc/nginx/sites-available/oasis /etc/nginx/sites-enabled/
#
# 证书获取（Let's Encrypt）：
#   certbot --nginx -d your-domain.com -d www.your-domain.com
# 证书自动续期：
#   echo "0 3 * * * certbot renew --quiet && systemctl reload nginx" | crontab -

# ---------------------------------------------------------------------------
# HTTP → HTTPS 重定向
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # Let's Encrypt ACME 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS 主站点
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # ── SSL 证书（由 certbot 自动写入）──
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # ── 安全加固 ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全 header
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    # ── 请求体大小限制（防止恶意大 payload）──
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 10s;

    # ── 限流（需先在 /etc/nginx/nginx.conf 的 http 块中定义 zone）──
    # 取消注释前请先添加:
    #   limit_conn_zone $binary_remote_addr zone=per_ip:10m;
    #   limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # limit_conn per_ip 20;
    # limit_req zone=api_limit burst=20 nodelay;

    # ── Gzip 压缩 ──
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 500;
    gzip_comp_level 4;

    # ── 日志 ──
    access_log /var/log/nginx/oasis_access.log;
    error_log  /var/log/nginx/oasis_error.log;

    # ── 反向代理到 FastAPI 后端 ──
    # 直接部署时使用: proxy_pass http://127.0.0.1:8000;
    # Docker 部署时请改为: proxy_pass http://backend:8000;
    location / {
        # ⚠️ Docker 部署前请将下行改为: proxy_pass http://backend:8000;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时：AI 分析单步可达 120s，给足余量
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;

        # 关闭代理缓冲，让流式响应直接传递
        # （未来支持 SSE 流式 AI 输出时无需改配置）
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ── 健康检查端点单独放行（不做限流）──
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        limit_req off;
        limit_conn off;
    }
}
