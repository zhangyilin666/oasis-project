name: xiaoyi-mobile
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: oasis_db
      MYSQL_USER: oasis_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    volumes:
      - mobile_mysql:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1]
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build: ./python_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://oasis_user:${MYSQL_PASSWORD}@db:3306/oasis_db?charset=utf8mb4
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_DEFAULT_MODEL: ${DEEPSEEK_DEFAULT_MODEL:-deepseek-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_DEFAULT_MODEL: ${ANTHROPIC_DEFAULT_MODEL:-claude-sonnet-4-6}
      ALLOW_MOCK_AI: ${ALLOW_MOCK_AI:-false}
      CORS_ORIGINS: ""
      RATE_LIMIT_ANALYZE_PER_DAY: ${RATE_LIMIT_ANALYZE_PER_DAY:-5}
      RATE_LIMIT_DIVINATION_PER_DAY: ${RATE_LIMIT_DIVINATION_PER_DAY:-5}
      REPORT_TIMEOUT_MINUTES: 15
    volumes:
      - ./data_center/knowledge:/app/data_center/knowledge:ro
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/health]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  web:
    build: ./oasis-uniapp
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - mobile_caddy_data:/data
      - mobile_caddy_config:/config
volumes:
  mobile_mysql:
  mobile_caddy_data:
  mobile_caddy_config:
